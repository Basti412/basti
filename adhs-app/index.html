<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADHS-Diagnosemappe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Vorbereitung auf die ADHS-Diagnostik bei Erwachsenen in Deutschland: Fragebögen, Checklisten, Unterlagen und Bericht für die Facharztpraxis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Zum Inhalt springen</a>
<div class="topbar">
  <button class="menu-btn" data-act="menu" aria-label="Menü öffnen" aria-controls="nav">☰</button>
  <a class="brand" href="#start"><span class="brand-mark" aria-hidden="true"></span><span>Diagnosemappe <b>ADHS</b></span></a>
  <span id="mobile-title" class="mobile-title"></span>
  <div class="top-prog" title="Fortschritt der Pflichtmodule"><div class="tp-bar"><span id="top-prog"></span></div><span id="top-prog-txt" class="tp-txt"></span></div>
  <span id="save-state" class="save-state" role="status">Lokal gespeichert</span>
  <button class="btn small ghost set-btn" data-act="settings" aria-expanded="false" aria-controls="settings">Ansicht</button>
</div>
<section id="settings" class="settings" hidden aria-label="Ansicht anpassen">
  <h2>Ansicht anpassen</h2>
  <fieldset><legend>Textgröße</legend>
    <div class="seg">
      <label><input type="radio" name="ui-text" id="ui-text-n" data-ui="text" value="normal"><span>Normal</span></label>
      <label><input type="radio" name="ui-text" id="ui-text-g" data-ui="text" value="gross"><span>Groß</span></label>
      <label><input type="radio" name="ui-text" id="ui-text-s" data-ui="text" value="sehrgross"><span>Sehr groß</span></label>
    </div></fieldset>
  <label class="chk"><input type="checkbox" id="ui-auto" data-ui="autoNext"><span><b>Automatisch weiter</b><small>Nach einer Antwort erscheint sofort die nächste Frage.</small></span></label>
  <label class="chk"><input type="checkbox" id="ui-calm" data-ui="calm"><span><b>Ruhige Ansicht</b><small>Seitenleiste ausblenden, gedämpfte Farben, keine Animationen.</small></span></label>
  <label class="chk"><input type="checkbox" id="ui-pause" data-ui="pause"><span><b>Pausen-Erinnerung</b><small>Nach 20 Minuten aktiver Bearbeitung ein kurzer Hinweis.</small></span></label>
  <label class="chk"><input type="checkbox" id="ui-speak" data-ui="speak"><span><b>Vorlesen-Knopf</b><small>Fragen werden auf Wunsch vorgelesen (sofern der Browser das kann).</small></span></label>
  <button class="btn small" data-act="settings">Fertig</button>
</section>
<div id="toast" class="toast" role="status" hidden></div>
<div class="layout">
  <nav id="nav" class="nav" aria-label="Module"></nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
